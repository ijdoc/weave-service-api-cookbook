name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
  WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
  WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
  COOKBOOK_ENVIRONMENT: ci

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run Python recipes
        run: |
          shopt -s nullglob
          for script in python/[0-9]*.py; do
            echo "::group::$script"
            if [[ "$script" == python/13_* ]]; then
              # Recipe 13 is read-only: a leaderboard view of every eval
              # run against the Eval Object. Mirror its stdout into the
              # job summary so the rendered table shows up on the workflow
              # run page without digging into the log.
              {
                echo "### Recipe 13 (Python) — query evaluation results"
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              uv run "$script" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              uv run "$script"
            fi
            echo "::endgroup::"
          done

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Run Ruby recipes
        run: |
          shopt -s nullglob
          for script in ruby/[0-9]*.rb; do
            echo "::group::$script"
            if [[ "$script" == ruby/13_* ]]; then
              {
                echo "### Recipe 13 (Ruby) — query evaluation results"
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ruby "$script" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              ruby "$script"
            fi
            echo "::endgroup::"
          done

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run .NET recipes
        run: |
          shopt -s nullglob
          for script in dotnet/[0-9]*.cs; do
            echo "::group::$script"
            if [[ "$script" == dotnet/13_* ]]; then
              {
                echo "### Recipe 13 (.NET) — query evaluation results"
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              dotnet run "$script" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              dotnet run "$script"
            fi
            echo "::endgroup::"
          done

  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run Go recipes
        run: |
          shopt -s nullglob
          for script in golang/[0-9]*.go; do
            echo "::group::$script"
            if [[ "$script" == golang/13_* ]]; then
              {
                echo "### Recipe 13 (Go) — query evaluation results"
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              go run "$script" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              go run "$script"
            fi
            echo "::endgroup::"
          done

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: jbangdev/setup-jbang@main
      - name: Run Java recipes
        run: |
          shopt -s nullglob
          for script in java/[0-9]*.java; do
            echo "::group::$script"
            if [[ "$script" == java/13_* ]]; then
              {
                echo "### Recipe 13 (Java) — query evaluation results"
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              jbang "$script" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              jbang "$script"
            fi
            echo "::endgroup::"
          done
